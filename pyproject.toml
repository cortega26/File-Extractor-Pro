[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "file-extractor-pro"
version = "0.1.0"
description = "Preview and combine selected local text files using a desktop GUI or CLI."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Carlos Ortega González" }]
keywords = ["file extraction", "text aggregation", "developer tools", "context packaging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/cortega26/File-Extractor-Pro"
Issues = "https://github.com/cortega26/File-Extractor-Pro/issues"

[project.scripts]
file-extractor-pro = "services.cli:main"

[project.gui-scripts]
file-extractor-pro-gui = "file_extractor:main"

[tool.setuptools]
packages = ["services", "ui_support"]
py-modules = [
    "file_extractor",
    "ui",
    "processor",
    "config_manager",
    "constants",
    "logging_utils",
]

[tool.isort]
profile = "black"
line_length = 88

# Fix: Q-110
[tool.pytest.ini_options]
addopts = "--cov=. --cov-report=term-missing --cov-report=xml --cov-branch --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = [
    "config_manager",
    "constants",
    "logging_utils",
    "processor",
    "services",
    "ui_support",
]
omit = [
    "tests/*",
    "ui.py",
    "file_extractor.py",
    # Fix: Q-110 - Tk-dependent UI support modules are validated via manual smoke tests.
    "ui_support/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
