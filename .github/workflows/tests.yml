name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov
      - name: Install the actual distribution
        run: python -m pip install .
      - name: Smoke-test installed CLI outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          file-extractor-pro --help
          file-extractor-pro "$GITHUB_WORKSPACE" --extensions py --dry-run --preview-format json > preview.json
          python -c "import json; p=json.load(open('preview.json', encoding='utf-8')); assert p['file_count'] > 0; print('Previewed', p['file_count'], 'files')"
          python -c "from importlib.metadata import distribution; d=distribution('file-extractor-pro'); names={e.name for e in d.entry_points}; assert {'file-extractor-pro', 'file-extractor-pro-gui'} <= names, names"
      - name: Run full test suite with coverage gate
        run: python -m pytest -q
